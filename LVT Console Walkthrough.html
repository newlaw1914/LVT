<style>
:root{
  /* Specialized core palette — Brand Guidelines v1.0 */
  --prism:#512FFF;
  --prism-deep:#190935;
  --shark:#92989B;
  --frost:#E8EAEF;
  /* console surfaces derived from black, biased toward the accent */
  --ink:#05060A;
  --panel:#0E1017;
  --panel-2:#151824;
  --panel-3:#1D2130;
  --line:#23262F;
  --line-soft:#171A22;
  --prism-soft:rgba(81,47,255,.13);
  --prism-line:#332B7A;
  --prism-lift:#9C86FF;
  /* operational state, never brand */
  --amber:#E0A93B;
  --red:#D64545;
  --green:#4FB286;
  /* type */
  --display:'Archivo','Termina',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;
  --sans:'Public Sans','General Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ink);color:var(--frost);
  font-family:var(--sans);font-size:15px;line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--prism-lift)}
:focus-visible{outline:2px solid var(--prism);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- brand devices ---------- */
.wordmark{font-family:var(--display);font-weight:600;letter-spacing:.34em;text-transform:uppercase;font-size:12px;color:var(--prism);white-space:nowrap}
.wordmark.frost{color:var(--frost)}
.trio{width:16px;height:15px;flex:0 0 auto;color:var(--prism)}
.trio path{stroke:currentColor}
.cropmark{position:fixed;right:-58px;bottom:-58px;width:250px;height:230px;z-index:0;color:var(--prism);opacity:.055;pointer-events:none}
.brandbar{display:flex;height:3px;margin:0 0 18px;border-radius:2px;overflow:hidden}
.brandbar i{display:block;height:3px}
.brandbar i:nth-child(1){width:14%;background:#000;border-top:1px solid var(--line)}
.brandbar i:nth-child(2){width:26%;background:var(--frost)}
.brandbar i:nth-child(3){width:60%;background:var(--prism)}

/* ---------- chrome ---------- */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:11px 20px;background:rgba(5,6,10,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(9px);
}
.docid{font-family:var(--mono);font-size:10.5px;color:var(--shark);letter-spacing:.09em;text-transform:uppercase}
.clock{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--frost);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--green)}
.progwrap{height:2px;background:var(--line);position:sticky;top:43px;z-index:39}
.progbar{height:2px;width:0;background:linear-gradient(90deg,var(--prism-deep),var(--prism));transition:width .4s ease}

.shell{display:grid;grid-template-columns:262px 1fr;min-height:100vh;position:relative;z-index:1}
.rail{border-right:1px solid var(--line);padding:20px 0 70px;position:sticky;top:45px;height:calc(100vh - 45px);overflow:auto}
.railhead{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--shark);padding:0 18px 8px}
.railgroup{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--prism);padding:16px 18px 6px;border-top:1px solid var(--line-soft);margin-top:6px}
.railgroup:first-of-type{border-top:0;margin-top:0}
.navitem{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;color:var(--shark);font-family:var(--sans);font-size:12.5px;padding:7px 18px;cursor:pointer;line-height:1.35}
.navitem:hover{color:var(--frost);background:var(--panel)}
.navitem.on{color:var(--frost);border-left-color:var(--prism);background:var(--prism-soft)}
.navitem .n{font-family:var(--mono);font-size:10px;color:var(--prism);min-width:20px}
.navitem.done .n::after{content:" ✓";color:var(--green)}
main{padding:32px 34px 120px;max-width:880px;position:relative;z-index:1}

.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--prism);margin:0 0 10px}

h2{font-family:var(--display);font-size:17px;margin:36px 0 12px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;padding-top:14px;border-top:1px solid var(--line)}
h3{font-family:var(--sans);font-size:13px;margin:22px 0 8px;letter-spacing:.14em;text-transform:uppercase;color:var(--shark);font-weight:600}
.subline{font-size:15.5px;color:var(--frost);line-height:1.5;margin:0 0 14px;max-width:64ch}
p{margin:0 0 12px;max-width:68ch}
ul,ol{margin:0 0 12px;padding-left:22px;max-width:66ch}
li{margin:0 0 6px}
b,strong{font-weight:600}
code,.mono{font-family:var(--mono);font-size:12.5px}
.small{font-size:12.5px}
.muted{color:var(--shark)}
.sopref{font-family:var(--mono);font-size:11px;color:var(--frost);background:var(--panel-2);border:1px solid var(--line);padding:2px 7px;border-radius:3px;white-space:nowrap}
.confirm{font-family:var(--mono);font-size:11.5px;color:var(--amber);background:rgba(224,169,59,.08);border:1px dashed #5A4620;padding:1px 6px;border-radius:3px}

/* ---------- cover ---------- */
.cover{position:relative;overflow:hidden;border:1px solid var(--prism-line);border-radius:8px;background:linear-gradient(118deg,#000 0%,var(--prism-deep) 48%,#3A1FD6 88%,var(--prism) 112%);padding:30px 32px 26px;margin:0 0 22px}
.cover .covermark{position:absolute;right:-42px;top:-46px;width:190px;height:175px;color:#fff;opacity:.16}
.cover h1{margin:12px 0 10px}
.cover .tag{font-size:13px;color:#D8D2FF;letter-spacing:.04em;margin:0}
.cover .kv{font-family:var(--mono);font-size:11px;color:#CFC8FF;letter-spacing:.05em}
.rule{height:1px;background:rgba(255,255,255,.22);margin:18px 0 12px;max-width:320px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0 0 20px}
.stat{background:var(--panel);padding:14px}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:26px;line-height:1;color:var(--frost);font-variant-numeric:tabular-nums}

/* ---------- blocks ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin:0 0 18px}
.card.tight{padding:14px 16px}
.example{border-left:2px solid var(--prism)}
.takeaway{background:linear-gradient(180deg,rgba(81,47,255,.11),rgba(81,47,255,.02));border-color:var(--prism-line)}

.ctrl{border:1px solid var(--prism-line);border-left:3px solid var(--prism);border-radius:5px;background:linear-gradient(180deg,rgba(81,47,255,.09),rgba(81,47,255,.015));padding:13px 16px;margin:0 0 18px}
.ctrl .lab{font-family:var(--display);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--prism);display:block;margin-bottom:5px;font-weight:600}
.ctrl p{margin:0;font-size:14px}

.tablewrap{overflow-x:auto;margin:0 0 14px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--shark);font-weight:400}
tbody tr:nth-child(even){background:rgba(232,234,239,.022)}
td.mono{font-family:var(--mono);font-size:12px;white-space:nowrap}

/* ---------- camera tiles ---------- */
.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:0 0 14px}
.tile{background:#02040A;border:1px solid var(--line);border-radius:5px;overflow:hidden;text-align:left;padding:0;color:inherit;font:inherit;cursor:pointer}
.tile.static{cursor:default}
.tile .scene{position:relative;height:112px;background:
  radial-gradient(120% 90% at 50% 120%, #0B1220 0%, #04060C 70%);
  border-bottom:1px solid var(--line)}
.tile .horizon{position:absolute;left:0;right:0;top:56%;height:1px;background:#182033}
.tile .lot{position:absolute;left:8%;right:8%;top:60%;bottom:8%;border:1px solid #141C2B;border-radius:2px}
.tile .subject{position:absolute;width:9px;height:20px;border-radius:4px;background:#2A3550;bottom:22%;left:26%}
.tile .veh{position:absolute;width:34px;height:13px;border-radius:2px;background:#1C2436;bottom:14%;right:16%}
.tile.thermal .scene{background:radial-gradient(120% 90% at 50% 120%, #16113A 0%, #05040E 72%)}
.tile.thermal .subject{background:#E0A93B;box-shadow:0 0 12px 4px rgba(224,169,59,.45)}
.tile.thermal .veh{background:#7A5C2A;box-shadow:0 0 10px 2px rgba(224,169,59,.18)}
.tile.thermal .lot{border-color:#241B4A}
.tile .meta{display:flex;align-items:center;gap:8px;padding:7px 10px;font-family:var(--mono);font-size:10.5px;color:var(--shark);letter-spacing:.06em}
.tile .meta .ts{margin-left:auto;color:var(--frost);font-variant-numeric:tabular-nums}
.tile.dead .meta .ts{color:var(--red)}
.tile.picked{border-color:var(--prism);box-shadow:0 0 0 1px var(--prism)}
.tile.right{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.tile.wrong{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}

/* screenshot placeholder, framed like an empty camera tile */
.shot{border:1px dashed #2E3340;border-radius:5px;background:repeating-linear-gradient(135deg,#080A11 0 10px,#0B0E16 10px 20px);padding:20px 18px;margin:0 0 18px;text-align:center}
.shot .lab{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--prism);display:block;margin-bottom:6px}

.shot .cap{font-size:12.5px;color:var(--shark);margin:0 auto;max-width:52ch}

/* ---------- feed ---------- */
.feed{background:#020306;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0 0 18px}
.feedhead{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--shark)}
.feedrow{display:grid;grid-template-columns:60px 1fr;gap:12px;padding:10px 14px;border-bottom:1px solid #101219;font-size:13.5px}
.feedrow:last-child{border-bottom:0}
.feedrow .t{font-family:var(--mono);font-size:12px;color:var(--amber);font-variant-numeric:tabular-nums}
.feedrow.sys .t{color:var(--shark)}
.feedrow.ok .t{color:var(--green)}
.feedrow.crit{background:rgba(214,69,69,.07)}
.feedrow.crit .t{color:var(--red)}

/* ---------- interaction ---------- */
.prompt{font-weight:600;margin:0 0 12px;font-size:15px}
.opts{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;color:var(--frost);font:inherit;padding:11px 13px;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--prism);background:var(--panel-3)}
.opt .k{font-family:var(--mono);font-size:11px;color:var(--prism);padding-top:2px;min-width:14px}
.opt.right{border-color:var(--green);background:rgba(79,178,134,.10)}
.opt.wrong{border-color:var(--red);background:rgba(214,69,69,.09)}
.opt:disabled{cursor:default;opacity:.92}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--prism);color:#fff;border:0;border-radius:4px;font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:12px 18px;cursor:pointer}
.btn:hover{background:#6444FF}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--frost)}
.btn.ghost:hover{border-color:var(--prism);background:var(--prism-soft)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.reveal{display:none;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.reveal.show{display:block}
.rlabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--shark);margin:0 0 6px}
.risk{color:#F0B7B7}
.good{color:#A8DFC6}
.docstrip{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:38px;padding-top:12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--shark)}
.docstrip .pg{margin-left:auto;color:var(--frost)}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 0}
  main{padding:24px 16px 90px}
  .cropmark{display:none}
}

<p class="subline">LiveView Technologies builds the solar powered, cellular connected units on the lots. Cameras, sensors, lights, a speaker. They report into a cloud platform you reach from a browser at the console. The units are the eyes. The platform is how you use them.</p>

    b.innerHTML=`<div class="scene"><div class="horizon"></div><div class="lot"></div><div class="subject" style="left:${18+i*13}%"></div>${i%2?'<div class="veh"></div>':''}</div>
      <div class="meta"><span>${c.id}</span><span class="muted">${c.label}</span><span class="ts">--:--:--</span></div>`;
    b.onclick=()=>{
      if(rev.classList.contains('show'))return;
      tiles.forEach((t,ti)=>{t.disabled=true;t.classList.add(ti===dead?'right':(ti===i?'wrong':''))});
      const ok=i===dead;
      rev.innerHTML=`<p class="rlabel">${ok?'Correct':'Not this one'}</p>
        <p class="${ok?'good':'risk'}">${ok
          ? 'CAM 3 is the frozen one. Its timestamp has not moved since the moment it died, and the image behind it is a still frame of an empty yard.'
          : 'That camera is live. CAM 3 is the dead one, and the only thing that gave it away was a clock that stopped.'}</p>
        <p class="small">A frozen feed is a fault, logged at the time of observation with site ID and timestamp under ${SOP('SOP-GSOC-006')}. Then the second question, which people forget: does any other camera cover that view? If not, that is a coverage gap and it gets recorded as one.</p>`;
      rev.classList.add('show');
      S.done.add(S.page);paint();
    };
    wall.appendChild(b);tiles.push(b);
  });
  function stamp(){
    const now=new Date();
    tiles.forEach((t,i)=>{
      const d=(i===dead)?new Date(base.getTime()-9*60000):now;
      t.querySelector('.ts').textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
    });
  }
  stamp();setInterval(stamp,1000);
}},

<p class="eyebrow">Part C · SOP-GSOC-006, 012, 013, 018</p>
<h1>Recorded video,<br>search and health</h1>

<h2>Pulling recorded footage</h2>
<p>Recorded video is looked up by unit, date and time, then scrubbed to the moment you need. You will use it to verify an alert the live view could not settle, and to reconstruct a sequence for a report.</p>
<p>You will also get asked for it after the fact. That request is not yours to answer. Law enforcement and external requests outside a live emergency go to the Program Director under ${SOP('SOP-GSOC-012')} and ${SOP('SOP-GSOC-018')}. You pull footage when someone who is allowed to ask, asks.</p>

<h2>Forensic Search</h2>
<p>Where the contract includes it, the platform searches footage by description instead of by timestamp. You type "white pickup" or "person on foot" and it surfaces candidate clips. On a needle in a haystack review that saves real time.</p>
<p>Two limits worth holding on to. A hit is a clip to go look at, not a fact. And it never appears in a record as a source. What goes in the record is what <b>you</b> observed on the footage it found. ${CF('whether Forensic Search is in scope for this program')}</p>

<h2>The health dashboard</h2>
<p>Health shows unit uptime, battery and voltage, power interruptions, connectivity, and self healing events where a unit recovered on its own. Check it at shift start and again through the shift. Feeds fail mid shift and they fail quietly.</p>

<div class="tablewrap">
<table>
  <thead><tr><th style="width:190px">What you see</th><th>What it usually means</th><th>What you do</th></tr></thead>
  <tbody>
    <tr><td><b>Unit offline</b></td><td>Connectivity or power loss. The site is dark.</td><td>Log it with site ID and time, report it, and record the coverage gap for the period.</td></tr>
    <tr><td><b>Voltage trending down</b></td><td>Solar shortfall, often weather or shading. It will go offline later.</td><td>Raise it before it fails. This is the one you can get ahead of.</td></tr>
    <tr><td><b>Repeated self healing</b></td><td>Something intermittent. It will look fine whenever anyone checks.</td><td>Log the pattern, not just the instance. Trend data is what gets it fixed.</td></tr>
    <tr><td><b>Image present, clock frozen</b></td><td>The feed is dead and looks alive.</td><td>Treat it as a lost camera. Log it, and check what else covers that view.</td></tr>
  </tbody>
</table>
</div>
<p>A fault at a high criticality site, or across multiple sites, goes up immediately under ${SOP('SOP-GSOC-013')}. Degraded operations are declared by the Supervisor, not absorbed quietly by whoever noticed.</p>

${SHOT('06','Health dashboard','The health view showing uptime and voltage for several units, with at least one degraded unit visible.')}

<h2>The mobile app</h2>
<p>LVT has a phone app that does most of what the desktop does, and it is useful for supervisors and field roles. On the floor it is a different question. Personal devices are prohibited at the console under ${SOP('SOP-GSOC-006')}, and watching a phone while seated at a console is not monitoring. ${CF('whether the mobile app is authorized for GSOC roles, and for whom')}</p>
`}},

/* ============================ widgets ============================ */
function checks(mountId,items){
  const host=document.getElementById(mountId);
  items.forEach((it,ix)=>{
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`<p class="mono muted" style="font-size:11px;margin-bottom:6px">Check ${ix+1} · Multiple choice</p>
      <p class="prompt">${it.q}</p><div class="opts" id="${mountId}o${ix}"></div><div class="reveal" id="${mountId}r${ix}"></div>`;
    host.appendChild(card);
    const ow=card.querySelector('#'+mountId+'o'+ix), rv=card.querySelector('#'+mountId+'r'+ix);
    it.o.forEach((o,oi)=>{
      const b=document.createElement('button');
      b.className='opt';
      b.innerHTML=`<span class="k">${String.fromCharCode(65+oi)}</span><span>${o}</span>`;
      b.onclick=()=>{
        [...ow.children].forEach((c,ci)=>{c.disabled=true;if(ci===it.a)c.classList.add('right');else if(ci===oi)c.classList.add('wrong');});
        const ok=oi===it.a;
        rv.innerHTML=`<p class="${ok?'good':'risk'}" style="margin-bottom:8px"><b>${ok?'Correct.':'Not correct.'}</b></p><p class="small">${it.ex}</p>`;
        rv.classList.add('show');
        S.done.add(S.page);paint();
      };
      ow.appendChild(b);
    });
  });
}

/* ============================ router ============================ */
function paint(){
  const rail=document.getElementById('rail');
  rail.innerHTML='<div class="railhead">Module contents</div>';
  let lastPart=null;
  SECTIONS.forEach((s,i)=>{
    if(s.part!==lastPart){
      const g=document.createElement('div');g.className='railgroup';g.textContent=s.part;
      rail.appendChild(g);lastPart=s.part;
    }
    const b=document.createElement('button');
    b.className='navitem'+(i===S.page?' on':'')+(S.done.has(i)?' done':'');
    b.innerHTML=`<span class="n">${String(i).padStart(2,'0')}</span><span>${s.nav}</span>`;
    b.onclick=()=>go(i);
    rail.appendChild(b);
  });
  document.getElementById('progbar').style.width=(S.done.size/SECTIONS.length*100)+'%';
}

function go(i){
  S.page=i;
  const m=document.getElementById('main');
  m.innerHTML=SECTIONS[i].render();
  if(SECTIONS[i].init)SECTIONS[i].init();
  if(i===0)S.done.add(0);

  const nav=document.createElement('div');
  nav.className='btnrow';nav.style.marginTop='34px';
  if(i>0){const p=document.createElement('button');p.className='btn ghost';p.textContent='← Back';p.onclick=()=>go(i-1);nav.appendChild(p);}
  if(i<SECTIONS.length-1){const n=document.createElement('button');n.className='btn';n.textContent='Continue →';n.onclick=()=>go(i+1);nav.appendChild(n);}
  m.appendChild(nav);

  const strip=document.createElement('div');

  strip.innerHTML=`<span>Specialized GSOC</span><span>GSOC-TRN-005</span><span>v0.1 Draft</span><span>Internal — operational</span>
    <span class="pg">${String(i).padStart(2,'0')} / ${String(SECTIONS.length-1).padStart(2,'0')}</span>`;
  m.appendChild(strip);

  paint();
  window.scrollTo({top:0,behavior:'smooth'});
}
go(0);
